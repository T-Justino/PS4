name: LinkResolver Android

on:
  push:
    branches: [claude/link-resolver-android-1vnk2h]
    paths: ['LinkResolver/**', '.github/workflows/linkresolver-android.yml']
  pull_request:
    paths: ['LinkResolver/**', '.github/workflows/linkresolver-android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkresolver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: LinkResolver
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma e build-tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Gradle (cache + wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Permissão do gradlew
        run: chmod +x gradlew

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee ../test.log

      - name: Gerar APK de debug
        run: ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log

      - name: Conferir APK
        run: |
          ls -l app/build/outputs/apk/debug/
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkResolver-debug-apk
          path: LinkResolver/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Enviar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: LinkResolver/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Resumo dos erros
        if: failure()
        run: |
          {
            echo "## ❌ Falha no build do LinkResolver"
            echo
            echo "### Erros de compilação / Gradle"
            echo '```'
            grep -hE "^e: |error:|FAILED|What went wrong|Execution failed|Could not " ../build.log ../test.log 2>/dev/null | head -60
            echo '```'
            echo "Log completo: veja os passos acima; relatórios de teste no artifact **test-reports**."
          } >> "$GITHUB_STEP_SUMMARY"
          grep -hE "^e: |error:" ../build.log ../test.log 2>/dev/null | head -30 | while read -r l; do echo "::error::$l"; done
