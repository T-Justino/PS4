name: LinkResolver test pages

# Publica LinkResolver/testpages na branch gh-pages. As páginas são servidas por raw.githack.com
# (HTML) e o arquivo de teste por cdn.jsdelivr.net — sem precisar ativar o GitHub Pages.
on:
  push:
    branches: [claude/link-resolver-android-1vnk2h]
    paths: ['LinkResolver/testpages/**', '.github/workflows/linkresolver-testpages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkresolver-testpages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES: https://raw.githack.com/T-Justino/PS4/gh-pages/v3
      FILE: https://cdn.jsdelivr.net/gh/T-Justino/PS4@gh-pages/v3/files/teste.bin
    steps:
      - uses: actions/checkout@v4

      - name: Publicar na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: LinkResolver/testpages
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "testpages: ${{ github.sha }}"

      - name: Verificar URLs de teste (HTML, arquivo, redirecionamentos reais)
        run: |
          S=/tmp/summary.md
          echo "## Páginas de teste do Link Resolver v0.3.0" > $S
          echo '| URL | HTTP | Content-Type |' >> $S; echo '|---|---|---|' >> $S
          fail=0
          for p in index.html abc/a.html abc/b.html abc/c.html meta/start.html meta/destino.html js/start.html js/destino.html \
                   http/301.html http/302.html http/303.html http/307.html http/308.html http/raw302.html http/destino.html \
                   loop/a.html loop/b.html dead/start.html dead/fim.html long/1.html long/2.html long/3.html long/4.html ads/start.html; do
            r=""
            for i in 1 2 3 4 5 6; do   # a CDN pode levar alguns segundos para ver o commit novo
              r=$(curl -s -L -o /dev/null -w '%{http_code} %{content_type}' "$PAGES/$p" || true)
              [ "${r%% *}" = "200" ] && break; sleep 10
            done
            [ "${r%% *}" = "200" ] || fail=1
            echo "| \`$PAGES/$p\` | ${r%% *} | ${r#* } |" >> $S
          done
          echo >> $S; echo '### Arquivo de teste (jsDelivr): HEAD e Range 0-0' >> $S; echo '```' >> $S
          curl -sI "$FILE" | tr -d '\r' | grep -iE '^(HTTP|content-type|content-length|accept-ranges)' >> $S || true
          curl -s -o /dev/null -D - -r 0-0 "$FILE" | tr -d '\r' | grep -iE '^(HTTP|content-range)' >> $S || true
          echo '```' >> $S
          echo '### Redirecionamentos HTTP reais (httpbin.dev)' >> $S; echo '```' >> $S
          D='https%3A%2F%2Fraw.githack.com%2FT-Justino%2FPS4%2Fgh-pages%2Fv3%2Fhttp%2Fdestino.html'
          for c in 301 302 303 307 308; do
            echo "status_code=$c:" >> $S
            curl -s -o /dev/null -D - -m 20 "https://httpbin.dev/redirect-to?url=$D&status_code=$c" | tr -d '\r' | grep -iE '^(HTTP|location)' >> $S || echo "(sem resposta)" >> $S
          done
          echo '```' >> $S
          echo '### 302 real github.com → raw.githubusercontent.com' >> $S; echo '```' >> $S
          curl -sI "https://github.com/T-Justino/PS4/raw/gh-pages/v3/files/teste.bin" | tr -d '\r' | grep -iE '^(HTTP|location)' >> $S || true
          echo '```' >> $S
          cat $S; cat $S >> "$GITHUB_STEP_SUMMARY"
          [ $fail = 0 ] || echo "::warning::alguma URL de teste não respondeu 200 (veja a tabela)"
