name: LinkResolver test pages

# Publica LinkResolver/testpages na branch gh-pages e verifica as URLs de teste.
#  - GitHub Pages (https://t-justino.github.io/PS4/): exige ativar UMA vez em Settings → Pages
#    (Deploy from a branch → gh-pages / root). O GITHUB_TOKEN não tem permissão para ativar (HTTP 403).
#  - raw.githack.com: serve o HTML da branch gh-pages sem configuração (alternativa imediata).
#  - cdn.jsdelivr.net: serve o arquivo de teste (HEAD 200 / Range 206).
on:
  push:
    branches: [claude/link-resolver-android-1vnk2h]
    paths: ['LinkResolver/testpages/**', '.github/workflows/linkresolver-testpages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkresolver-testpages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES: https://t-justino.github.io/PS4
      GITHACK: https://raw.githack.com/T-Justino/PS4/gh-pages
      FILE: https://cdn.jsdelivr.net/gh/T-Justino/PS4@gh-pages/v3/files/teste.bin
    steps:
      - uses: actions/checkout@v4

      - name: Publicar na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: LinkResolver/testpages
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "testpages: ${{ github.sha }}"

      - name: Verificar URLs de teste
        run: |
          S=/tmp/summary.md
          echo "## Páginas de teste do Link Resolver v0.4.0" > $S
          PATHS="v4/index.html v4/tabs/start.html v4/tabs/etapa2.html v4/popup-ad/start.html v4/popup-ad/download.html v4/popup-ad/anuncio.html \
                 v4/timer/start.html v4/timer/destino.html v4/dynamic/start.html v4/dynamic/link.html v4/dynamic/destino.html \
                 v4/human/start.html v4/human/destino.html v4/combo/start.html v4/combo/timer.html v4/combo/verifica.html \
                 v4/popup-flood/start.html v4/popup-flood/lixo.html v4/popup-flood/destino.html \
                 v3/abc/a.html v3/http/302.html v3/loop/a.html \
                 v5/index.html v5/app/index.html v5/app/guide.html v5/video/index.html v5/hosts/index.html v5/hosts/host-mega.html v5/hosts/host-mediafire.html \
                 v5/multi/index.html v5/none/index.html v5/none/guide.html v5/user/index.html"
          for BASE in "$GITHACK" "$PAGES"; do
            echo "### $BASE" >> $S; echo '| caminho | HTTP | Content-Type |' >> $S; echo '|---|---|---|' >> $S
            tries=6; [ "$BASE" = "$PAGES" ] && tries=1   # o Pages só responde depois de ativado manualmente
            for p in $PATHS; do
              r=""
              for i in $(seq 1 $tries); do
                r=$(curl -s -L -o /dev/null -w '%{http_code} %{content_type}' "$BASE/$p" || true)
                [ "${r%% *}" = "200" ] && break; [ $i -lt $tries ] && sleep 8
              done
              echo "| \`$p\` | ${r%% *} | ${r#* } |" >> $S
            done
          done
          echo >> $S; echo '### Arquivo de teste (jsDelivr): HEAD e Range 0-0' >> $S; echo '```' >> $S
          curl -sI "$FILE" | tr -d '\r' | grep -iE '^(HTTP|content-type|content-length|accept-ranges)' >> $S || true
          curl -s -o /dev/null -D - -r 0-0 "$FILE" | tr -d '\r' | grep -iE '^(HTTP|content-range)' >> $S || true
          echo '```' >> $S
          echo >> $S; echo '### Arquivos de teste v5 (jsDelivr): HEAD' >> $S; echo '| arquivo | HTTP | Content-Type | bytes |' >> $S; echo '|---|---|---|---|' >> $S
          for f in super-teste-app.zip guia-download.mp4 guidedownloadgame.mp4 filme-teste.mp4 alpha-station.zip beta-runner.zip gamma-tools.zip tutorial-delta.mp4 capa-delta.jpg mario-world.zip zelda-quest.zip; do
            h=$(curl -sI -L "https://cdn.jsdelivr.net/gh/T-Justino/PS4@gh-pages/v5/files/$f" | tr -d '\r' | tr 'A-Z' 'a-z')
            echo "| $f | $(echo "$h" | grep -m1 '^http' | cut -d' ' -f2) | $(echo "$h" | grep -m1 '^content-type' | cut -d' ' -f2) | $(echo "$h" | grep -m1 '^content-length' | cut -d' ' -f2) |" >> $S
          done
          if ! curl -s -o /dev/null -w '%{http_code}' "$PAGES/v4/index.html" | grep -q 200; then
            echo "::notice::GitHub Pages ainda não está ativo. Ative em Settings → Pages → Deploy from a branch → gh-pages / (root). Enquanto isso use as URLs raw.githack.com."
            echo '> GitHub Pages ainda **não está ativo**: Settings → Pages → Deploy from a branch → `gh-pages` / `(root)` (uma única vez).' >> $S
          fi
          cat $S; cat $S >> "$GITHUB_STEP_SUMMARY"
