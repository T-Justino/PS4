name: LinkResolver live GitHub check

# Teste REAL em rede: varre github.com/retrobrews/snes-games com o PageScanner (Chromium/Playwright) e roda o
# motor completo com a verificação OkHttp real até a URL Raw de uma ROM. Não bloqueia o APK.
on:
  workflow_dispatch:
  push:
    branches: [claude/link-resolver-android-1vnk2h]
    paths: ['LinkResolver/tools/live-scan.js', '.github/workflows/linkresolver-live.yml', 'LinkResolver/app/src/test/java/app/linkresolver/core/LiveGithubTest.kt']

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: LinkResolver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Playwright + Chromium
        working-directory: .
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Varrer o GitHub real (PageScanner)
        env:
          NODE_PATH: /tmp/pw/node_modules
          LR_LIVE_DIR: ${{ github.workspace }}/live
        run: node tools/live-scan.js https://github.com/retrobrews/snes-games
      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Motor completo sobre a varredura real (HEAD/Range reais)
        id: live
        continue-on-error: true
        env:
          LR_LIVE: '1'
          LR_LIVE_DIR: ${{ github.workspace }}/live
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests 'app.linkresolver.core.LiveGithubTest' -i --no-daemon 2>&1 | tee /tmp/live-gradle.log | grep -E '^e: |^\s*\[LIVE\]|FAILED|PASSED|BUILD|OutOfMemory|What went wrong' || true
          cp /tmp/live-gradle.log ../live/gradle.log || true
      - name: Relatório
        if: always()
        run: |
          { echo '## Teste real GitHub (retrobrews/snes-games)'; echo '```'; cat ../live/report.txt 2>/dev/null; echo; cat ../live/live-report.txt 2>/dev/null; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-github-scans
          path: live/
          if-no-files-found: ignore
