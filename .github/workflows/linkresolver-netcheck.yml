name: LinkResolver net check

# Diagnóstico: quais hosts públicos servem HTML estático e redirecionamentos HTTP reais a partir de um runner.
on:
  push:
    branches: [claude/link-resolver-android-1vnk2h]
    paths: ['.github/workflows/linkresolver-netcheck.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Redirecionamentos HTTP reais (candidatos)
        run: |
          D='https%3A%2F%2Fgithub.com%2FT-Justino%2FPS4'
          UA='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36'
          show() { echo "--- $1"; shift; "$@" 2>&1 | tr -d '\r' | grep -iE '^(HTTP|location|content-type)' | head -4 || true; }
          for c in 301 302 303 307 308; do
            show "httpbun.com $c" curl -s -m 20 -A "$UA" -D - -o /dev/null "https://httpbun.com/redirect-to?url=$D&status_code=$c"
          done
          for c in 301 307; do
            show "httpbin.dev $c" curl -s -m 20 -A "$UA" -D - -o /dev/null "https://httpbin.dev/redirect-to?url=$D&status_code=$c"
            show "postman-echo $c" curl -s -m 20 -A "$UA" -D - -o /dev/null "https://postman-echo.com/redirect-to?url=$D&status_code=$c"
          done
          show "httpbun HEAD 308" curl -sI -m 20 -A "$UA" "https://httpbun.com/redirect-to?url=$D&status_code=308"
          show "google.com 301" curl -sI -m 20 https://google.com/
          show "github raw .bin" curl -sI -m 20 https://github.com/T-Justino/PS4/raw/gh-pages/v3/files/teste.bin
          show "raw .bin final" curl -sI -m 20 https://raw.githubusercontent.com/T-Justino/PS4/gh-pages/v3/files/teste.bin
          show "raw .bin Range" curl -s -o /dev/null -D - -r 0-0 -m 20 https://raw.githubusercontent.com/T-Justino/PS4/gh-pages/v3/files/teste.bin
      - name: Arquivo .bin e páginas via githack
        run: |
          for u in "https://raw.githack.com/T-Justino/PS4/gh-pages/v3/files/teste.bin" "https://raw.githack.com/T-Justino/PS4/gh-pages/v3/index.html"; do
            echo "--- $u"; curl -sI -m 25 "$u" | tr -d '\r' | grep -iE '^(HTTP|content-type|content-length|accept-ranges|location)'
            echo "(Range 0-0)"; curl -s -o /dev/null -D - -r 0-0 -m 25 "$u" | tr -d '\r' | grep -iE '^(HTTP|content-range|content-type)'
          done
